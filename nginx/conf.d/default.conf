server {
    listen 80;
    server_name freeflowenergy.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name freeflowenergy.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/freeflowenergy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeflowenergy.duckdns.org/privkey.pem;
    client_max_body_size 50M;

    # Route API traffic to the backend container
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route all other traffic to the frontend container
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}