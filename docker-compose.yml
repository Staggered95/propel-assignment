services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kspdb_admin
      POSTGRES_PASSWORD: kspdb@admin
      POSTGRES_DB: kspdb
    ports:
      - "5434:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_USER=kspdb_admin
      - DB_PASSWORD=kspdb@admin
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kspdb
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: