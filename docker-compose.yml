services:
  db:
    image: postgres:15-alpine
    container_name: kspdb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kspdb_admin
      POSTGRES_PASSWORD: kspdb@admin
      POSTGRES_DB: kspdb
    ports:
      - "5434:5432"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: kspdb-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_USER=kspdb_admin
      - DB_PASSWORD=kspdb@admin
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=kspdb
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: kspdb-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot
    depends_on:
      - backend

volumes:
  pgdata: